server:
  port: 8080

spring:
  application:
    name: canteen-system
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # TODO: 本地 MySQL 密码改成自己的；数据库由 sql/schema.sql 创建
    url: jdbc:mysql://localhost:3306/canteen?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: "123456"
  redis:
    # TODO: 本地 Redis 连接信息（Windows 需先启动 Redis 服务）
    host: localhost
    port: 6379
    database: 0
    timeout: 5000

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.canteen.entity
  configuration:
    map-underscore-to-camel-case: true   # 数据库下划线 -> Java 驼峰
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

# Redisson 分布式锁配置已由默认 YAML 兼容读取，足够本地开发使用
# 项目配置项
canteen:
  jwt:
    # TODO: 上线时更换为随机长字符串，不要硬编码出现真实密钥（考试项目本地无所谓，但注释里写明）
    secret: canteen-system-dev-secret-key
    expire-hours: 24
