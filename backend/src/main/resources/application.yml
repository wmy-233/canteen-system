server:
  port: 8080

spring:
  application:
    name: canteen-system
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # TODO: 本地 MySQL 密码改成自己的；数据库由 sql/schema.sql 创建
    url: jdbc:mysql://localhost:3306/canteen?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: "123456"
  redis:
    # 用 127.0.0.1 而不是 localhost（localhost 优先解析 IPv6 会连不上只绑定 IPv4 的 Redis）
    host: 127.0.0.1
    port: 6379
    database: 0
    timeout: 5000

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.canteen.entity
  configuration:
    map-underscore-to-camel-case: true   # 数据库下划线 -> Java 驼峰
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

canteen:
  jwt:
    # JWT 签名密钥（HS256 要求至少 32 字节；上线/考试环境示例，勿外传都是本地开发）
    secret: canteen-system-dev-secret-key-0123456789abcdef
    expire-hours: 24
