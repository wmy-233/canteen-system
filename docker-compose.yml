# ============================================================
# 本地开发环境编排（组员 C 维护）
# 用法：docker compose up -d
# 验证：docker exec canteen-redis redis-cli ping  →  PONG
#       docker exec canteen-mysql mysql -uroot -p123456 -e "SELECT 1"
# 说明：Redis 无密码（与 application.yml 对齐）；MySQL root 密码 123456（与 yml 对齐）
#       MySQL 首次启动自动执行 sql/schema.sql + sql/init_data.sql（仅数据卷为空时）
#       本机装过原生 Redis 的先停用（net stop Redis），避免 6379 端口冲突
#       本机原有 MySQL 服务（如 phpStudy 的 mysqlzt）同理别同时启动，避免 3306 冲突
# ============================================================
services:
  redis:
    image: redis:6-alpine
    container_name: canteen-redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    container_name: canteen-mysql
    environment:
      MYSQL_ROOT_PASSWORD: "123456"
      MYSQL_DATABASE: canteen
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./sql/init_data.sql:/docker-entrypoint-initdb.d/02-init_data.sql:ro
      - canteen-mysql-data:/var/lib/mysql
    restart: unless-stopped

volumes:
  canteen-mysql-data:

